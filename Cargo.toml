[package]
name = "vsixHarvester"
version = "0.2.11"
edition = "2021"
authors = ["bamboogeneral@shortarrow.jp","Ronan Le Meillat"]
description = "A CLI tool to download VSCode extensions from extensions.json"
license = "MIT"
repository = "https://github.com/sctg-development/vsixHarvester"
homepage = "https://github.com/sctg-development/vsixHarvester"
documentation = "https://github.com/sctg-development/vsixHarvester"
readme = "README.md"


[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
reqwest = { version = "0.13.5", features = ["json", "cookies", "gzip"] }
tokio = { version = "1.53.2", features = ["macros","rt-multi-thread"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
thiserror = "2.0.21"
futures = "0.3.34"
log = "0.4.34"
env_logger = "0.11.11"
bitflags = "2.13.2"
tempfile = "3.27.0"

[dev-dependencies]
tempfile = "3.27.0"


