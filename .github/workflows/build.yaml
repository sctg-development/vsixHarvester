name: Deploy

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  id-token: write
  contents: write
  attestations: write
  packages: write

jobs:
  build-and-upload:
    name: Build and upload
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - build: ubuntu-noble-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
            family: ubuntu-24.04
            binary_extension: ""

          - build: ubuntu-noble-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            family: ubuntu-24.04
            binary_extension: ""

          - build: ubuntu-resolute-amd64
            os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
            family: ubuntu-26.04
            binary_extension: ""

          - build: ubuntu-resolute-arm64
            os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            family: ubuntu-26.04
            binary_extension: ""

          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: amd64
            family: windows
            binary_extension: ".exe"

          - build: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            family: macos
            binary_extension: ""

          - build: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            arch: amd64
            family: macos
            binary_extension: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get the release version from the tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          use-cross: false
          command: build
          args: --verbose --release --target ${{ matrix.target }}

      - name: Build archive
        shell: bash
        run: |
          # Replace with the name of your binary
          binary_name="vsixHarvester"

          dirname="$binary_name-${{ env.VERSION }}-${{ matrix.target }}"
          mkdir "$dirname"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/$binary_name.exe" "vsixHarvester_${{ matrix.family }}_${{ matrix.arch }}_${{ env.VERSION }}.exe"
            echo "ASSET=vsixHarvester_${{ matrix.family }}_${{ matrix.arch }}_${{ env.VERSION }}.exe" >> $GITHUB_ENV
          else
            cp "target/${{ matrix.target }}/release/$binary_name" "vsixHarvester_${{ matrix.family }}_${{ matrix.arch }}_${{ env.VERSION }}"
            echo "ASSET=vsixHarvester_${{ matrix.family }}_${{ matrix.arch }}_${{ env.VERSION }}" >> $GITHUB_ENV 
          fi
          
      - name: Attest release
        uses: actions/attest-build-provenance@v1
        continue-on-error: true
        with:
          subject-path: "vsixHarvester_${{ matrix.family }}_${{ matrix.arch }}_${{ env.VERSION }}${{ matrix.binary_extension }}"

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.ASSET }}